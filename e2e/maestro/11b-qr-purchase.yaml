# الجوال الافتراضي · ١١ ب · فاتورة شراءٍ من صورة QR الفاتورة (التوجيه الرابع ٦ · ١): موردٌ مصطنع ليُفتح نموذج الفاتورة، ثم «قراءة QR
# الفاتورة» من المعرض، فموردٌ جديد من الرمز، والمبالغ ١٠٠٠ + ١٥٠ = ١١٥٠، ثم الحفظ · أسماء وأرقام مصطنعة بحروفٍ لاتينية
appId: com.aqari.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "الرئيسية"
    timeout: 120000
# موردٌ أول (نموذج الفاتورة لا يُفتح بلا مورد)
- tapOn: "المزيد"
- scrollUntilVisible:
    element: "الموردون"
    direction: DOWN
- tapOn: "الموردون"
- tapOn: "+ مورد جديد"
- tapOn:
    id: "field-اسم المورد"
- inputText: "E2E First Supplier"
- hideKeyboard
- tapOn: "إضافة المورد"
- extendedWaitUntil:
    visible: "E2E First Supplier"
    timeout: 15000
- back
# فاتورة الشراء
- scrollUntilVisible:
    element: "فواتير الشراء"
    direction: UP
- tapOn: "فواتير الشراء"
- tapOn: "+ تسجيل فاتورة شراء"
- tapOn: "قراءة QR الفاتورة"
- tapOn: "صورة من المعرض"
# منتقي الصور في النظام: أول صورة (المدفوعة في ١١ أ وحدها)
- extendedWaitUntil:
    visible:
      text: "(Photo|Image|صورة).*"
    timeout: 20000
- takeScreenshot: 11-picker
- tapOn:
    text: "(Photo|Image|صورة).*"
    index: 0
- tapOn:
    text: "Done|Add|إضافة|تم"
    optional: true
- extendedWaitUntil:
    visible: "موردٌ غير مسجّل"
    timeout: 30000
- takeScreenshot: 11-new-supplier
- tapOn: "إضافة المورد"
- extendedWaitUntil:
    visible: "عُبّئت الفاتورة من الرمز"
    timeout: 15000
- tapOn: "تم"
- assertVisible: "E2E QR Supplier"
- assertVisible: "1150.00|1,150.00"
- takeScreenshot: 11-filled
- scrollUntilVisible:
    element: "تسجيل الفاتورة"
    direction: DOWN
- tapOn: "تسجيل الفاتورة"
- tapOn:
    text: "متابعة|حفظ|تسجيل"
    optional: true
- extendedWaitUntil:
    visible: "E2E QR Supplier"
    timeout: 20000
- takeScreenshot: 11-saved

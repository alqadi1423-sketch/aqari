# الجوال الافتراضي · ٠٤ أ · عقارٌ يُحفظ ثم تُضغط الذاكرة ويُقتل التطبيق (التوجيه الرابع ٤ · ١) · بلا بيانات حقيقية
appId: com.aqari.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "الرئيسية"
    timeout: 120000
- tapOn: "العقارات"
- tapOn: "+ عقار جديد"
- tapOn:
    id: "field-اسم العقار"
- inputText: "E2E Persist"
- tapOn:
    id: "field-عدد الوحدات"
- inputText: "1"
- hideKeyboard
- tapOn: "إضافة العقار"
- tapOn:
    text: "إضافة الوحدات الآن"
    optional: true
- extendedWaitUntil:
    visible: "E2E Persist"
    timeout: 20000

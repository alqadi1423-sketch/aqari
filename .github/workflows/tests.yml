# الاختبارات كاملة على لينكس مع كل رفع (قرار المالك ٢٠٢٦-١٠-٠٥) · بيانات الاختبارات مصطنعة كلها،
# ولا سرّ هنا: محاكي Firestore بمشروع تجريبي demo-aqari لا يصل إلى السحابة.
# وخلاصة كل تشغيل تُكتب في فرع ci-results (ملف لكل التزام) فتُقرأ بالمفتاح نفسه بلا دخول إلى الموقع.
# مراجعة التثبيت #43: التثبيت والاختبار بصلاحية قراءة وحدها وبلا مفتاح محفوظ، والكتابة في ci-results في عملٍ مستقل لا
# يشغّل حزمةً مثبّتة · والإجراءات ببصمة التزامها لا بوسمها.
name: الاختبارات

on:
  push:
    branches-ignore: [ci-results, apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # توقيت الرياض كجهاز المالك · واختبارات التواريخ تثبّته في ملفاتها أيضاً
      TZ: Asia/Riyadh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت الحزم
        run: npm ci

      - name: فحص الأنواع
        run: npx tsc --noEmit

      - name: الاختبارات كاملة مع محاكي Firestore
        run: npx --yes firebase-tools@15.32.1 emulators:exec --only firestore,storage --project demo-aqari "npx jest -i --json --outputFile=jest-results.json"

      - name: الخلاصة
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            let r = {};
            try { r = JSON.parse(fs.readFileSync("jest-results.json", "utf8")); } catch {}
            const failed = (r.testResults || []).filter((t) => t.status !== "passed").map((t) => t.name.replace(process.cwd() + "/", ""));
            const lines = [
              "commit " + process.env.GITHUB_SHA,
              "run " + process.env.GITHUB_SERVER_URL + "/" + process.env.GITHUB_REPOSITORY + "/actions/runs/" + process.env.GITHUB_RUN_ID,
              "os " + process.env.RUNNER_OS + " · node " + process.version + " · TZ " + process.env.TZ,
              "success " + (r.success === true),
              "suites " + (r.numPassedTestSuites ?? "?") + " passed / " + (r.numTotalTestSuites ?? "?") + " total",
              "tests " + (r.numPassedTests ?? "?") + " passed · " + (r.numFailedTests ?? "?") + " failed · " + (r.numPendingTests ?? "?") + " skipped / " + (r.numTotalTests ?? "?") + " total",
              ...failed.map((f) => "failed-suite " + f),
            ];
            fs.writeFileSync("result.txt", lines.join("\n") + "\n");
          '

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: result
          path: result.txt

  # الكتابة في ci-results وحدها بصلاحية كتابة · لا تثبيت ولا تشغيل لحزمة هنا
  publish:
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: result
          path: /tmp/result

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ci-results
          path: ci

      - name: نشر الخلاصة في فرع ci-results
        working-directory: ci
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          mkdir -p runs
          cp /tmp/result/result.txt "runs/${GITHUB_SHA}.txt"
          cp /tmp/result/result.txt latest.txt
          git add runs latest.txt
          git commit -q -m "نتيجة الاختبارات ${GITHUB_SHA}"
          git push -q origin HEAD:ci-results

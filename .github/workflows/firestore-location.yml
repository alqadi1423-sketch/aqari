# قراءة موقع قاعدة Firestore من إعداد المشروع وحده، لا البيانات (إذن المالك 2026-11-10 · رده على تقرير التوجيه الرابع ٢، البند ٤).
# بحساب النشر نفسه (السر FIREBASE_SERVICE_ACCOUNT): يُكتب مفتاحه في ملفٍ مؤقت لا يُطبع ويُحذف، ولا يُقرأ مستندٌ ولا مجموعة.
# الناتج ثلاثة حقول غير سرية (المعرّف والموقع والنوع) تُكتب في فرع ci-results ثم تُنقل إلى docs/DESIGN.md.
# يعمل حين يتغيّر هذا الملف وحده، ويدوياً.
name: موقع قاعدة Firestore

on:
  push:
    paths: [.github/workflows/firestore-location.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT: aqari-ec12e
    steps:
      - name: قراءة إعداد القاعدة
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          f="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$SA_JSON" > "$f"
          gcloud auth activate-service-account --key-file="$f" --quiet 2>/dev/null
          if gcloud firestore databases list --project "$FIREBASE_PROJECT" --format=json > "$RUNNER_TEMP/dbs.json" 2> "$RUNNER_TEMP/err.txt"; then
            jq -r '.[] | "database " + (.name | split("/") | last) + " · location " + .locationId + " · type " + .type' "$RUNNER_TEMP/dbs.json" > location.txt
          else
            echo "failed: $(head -c 300 "$RUNNER_TEMP/err.txt" | tr '\n' ' ')" > location.txt
          fi
          gcloud auth revoke --all --quiet 2>/dev/null || true
          rm -f "$f"
          cat location.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: location
          path: location.txt

  publish:
    needs: read
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: location
          path: /tmp/location

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ci-results
          path: ci

      - name: نشر الموقع في فرع ci-results
        working-directory: ci
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp /tmp/location/location.txt firestore-location.txt
          git add firestore-location.txt
          git commit -q -m "موقع قاعدة Firestore ${GITHUB_SHA}" || true
          git push -q origin HEAD:ci-results

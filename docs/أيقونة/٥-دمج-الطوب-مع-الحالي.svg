<text x="640" y="122" text-anchor="end" font-size="17" font-weight="700" fill="#10192E">ص · بيتٌ من طوب وبابه قمرية</text>
<text x="640" y="148" text-anchor="end" font-size="13" fill="#6B7280">الطوب داخل البيت وحده · والخارج يبقى نظيفاً</text>

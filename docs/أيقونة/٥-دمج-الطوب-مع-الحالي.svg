<text x="640" y="262" text-anchor="end" font-size="17" font-weight="700" fill="#10192E">ق · جدارٌ كامل والبيت خطٌّ عليه</text>
<text x="640" y="288" text-anchor="end" font-size="13" fill="#6B7280">الطوب يملأ الأيقونة كما في الصورة، والبيت فوقه</text>
<g transform="translate(56,360) scale(1.08)"><g clip-path="url(#sq4)"><use href="#q3"/></g></g>
<g transform="translate(184,392) scale(0.44)"><g clip-path="url(#ci4)"><use href="#q3"/></g></g>
<text x="640" y="402" text-anchor="end" font-size="17" font-weight="700" fill="#10192E">ر · البيت يقف على قاعدة طوب</text>
<text x="640" y="428" text-anchor="end" font-size="13" fill="#6B7280">جدار في الأسفل وبيت فوقه · فصلٌ واضح بين الطبقتين</text>
<g transform="translate(56,500) scale(1.08)"><g clip-path="url(#sq4)"><use href="#q4"/></g></g>
<g transform="translate(184,532) scale(0.44)"><g clip-path="url(#ci4)"><use href="#q4"/></g></g>
<text x="640" y="542" text-anchor="end" font-size="17" font-weight="700" fill="#10192E">ش · البيت فتحةٌ مضيئة في الجدار</text>
<text x="640" y="568" text-anchor="end" font-size="13" fill="#6B7280">الجدار طوب، وشكل البيت مفرَّغ فيه وخلفه زجاج القمرية</text>

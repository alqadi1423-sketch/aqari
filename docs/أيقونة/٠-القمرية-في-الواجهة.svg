<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1180" width="1040" height="1180" font-family="'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="98%" r="72%">
      <stop offset="0" stop-color="#E2B25A"/>
      <stop offset="0.5" stop-color="#C39A42"/>
      <stop offset="1" stop-color="#8C6C24"/>
    </radialGradient>

    <!-- القمرية · جصّ مفرَّغ فوق زجاج · قاعدتها عند y=200 -->
    <g id="qam">
      <path d="M20 200 A180 180 0 0 1 380 200 Z" fill="url(#glow)"/>
      <path d="M20 200 A180 180 0 0 1 44 110 L112 200 Z" fill="#10192E"/>
      <path d="M380 200 A180 180 0 0 0 356 110 L288 200 Z" fill="#10192E"/>
      <g fill="#1E6E5C">
        <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z"/>
        <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z" transform="rotate(-31 200 200)"/>
        <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z" transform="rotate(31 200 200)"/>
        <path d="M200 190 C178 155 180 128 200 104 C220 128 222 155 200 190 Z" transform="rotate(-64 200 200)"/>
        <path d="M200 190 C178 155 180 128 200 104 C220 128 222 155 200 190 Z" transform="rotate(64 200 200)"/>
      </g>
      <g fill="none" stroke="#F6F4EE" stroke-linecap="round" stroke-linejoin="round">
        <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z" stroke-width="9"/>
        <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z" stroke-width="9" transform="rotate(-31 200 200)"/>
        <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z" stroke-width="9" transform="rotate(31 200 200)"/>
        <path d="M200 190 C178 155 180 128 200 104 C220 128 222 155 200 190 Z" stroke-width="9" transform="rotate(-64 200 200)"/>
        <path d="M200 190 C178 155 180 128 200 104 C220 128 222 155 200 190 Z" stroke-width="9" transform="rotate(64 200 200)"/>
        <path d="M128 200 A72 72 0 0 1 272 200" stroke-width="10"/>
        <path d="M162 96 Q200 52 238 96" stroke-width="9"/>
        <path d="M162 52 Q200 96 238 52" stroke-width="9"/>
        <path d="M28 200 A172 172 0 0 1 372 200" stroke-width="12"/>
        <path d="M8 206 A192 192 0 0 1 392 206" stroke-width="16"/>
        <path d="M2 206 H398" stroke-width="14"/>
      </g>
    </g>

    <!-- النسخة الخطّية · بلا زجاج · للحالات الفارغة والفواصل -->
    <g id="qamLine" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z" stroke-width="9"/>
      <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z" stroke-width="9" transform="rotate(-31 200 200)"/>
      <path d="M200 190 C168 140 172 95 200 58 C228 95 232 140 200 190 Z" stroke-width="9" transform="rotate(31 200 200)"/>
      <path d="M200 190 C178 155 180 128 200 104 C220 128 222 155 200 190 Z" stroke-width="9" transform="rotate(-64 200 200)"/>
      <path d="M200 190 C178 155 180 128 200 104 C220 128 222 155 200 190 Z" stroke-width="9" transform="rotate(64 200 200)"/>
      <path d="M128 200 A72 72 0 0 1 272 200" stroke-width="10"/>
      <path d="M162 96 Q200 52 238 96" stroke-width="9"/>
      <path d="M162 52 Q200 96 238 52" stroke-width="9"/>
      <path d="M28 200 A172 172 0 0 1 372 200" stroke-width="12"/>
      <path d="M2 202 H398" stroke-width="11"/>
    </g>
  </defs>

  <rect width="1040" height="1180" fill="#F6F4EE"/>
  <text x="1000" y="52" text-anchor="end" font-size="27" font-weight="700" fill="#10192E">القمرية بلوحة التطبيق · ثلاثة استعمالات</text>
  <text x="1000" y="84" text-anchor="end" font-size="16" fill="#6B7280">الجصّ paper · الكهرمان gold · الأخضر emerald · الأزرق ink · بلا لون جديد</text>

  <!-- ١ · العلامة الكاملة -->
  <text x="1000" y="140" text-anchor="end" font-size="19" font-weight="700" fill="#1E6E5C">١ · العلامة الكاملة — شاشة البدء و«عن التطبيق»</text>
  <g transform="translate(320,160)"><use href="#qam"/></g>
  <text x="1000" y="200" text-anchor="end" font-size="15" fill="#6B7280">زجاج مضاء وجصّ مفرَّغ · لحظةٌ بلا بيانات فتحتمل الزخرفة</text>

  <!-- ٢ · شريط الرأس -->
  <text x="1000" y="470" text-anchor="end" font-size="19" font-weight="700" fill="#1E6E5C">٢ · شريط الرأس — قوسٌ باهت خلف اسم الشاشة</text>
  <rect x="60" y="492" width="920" height="132" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
  <g opacity="0.14" transform="translate(600,470) scale(0.78)"><use href="#qamLine" stroke="#1E6E5C"/></g>
  <text x="944" y="556" text-anchor="end" font-size="25" font-weight="700" fill="#10192E">الرئيسية</text>
  <g transform="translate(716,536)" fill="none" stroke="#10192E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 12 H26 M18 4 l10 8 -10 8"/>
  </g>
  <text x="700" y="556" text-anchor="end" font-size="18" fill="#10192E">رجوع</text>
  <text x="1000" y="662" text-anchor="end" font-size="15" fill="#6B7280">شفافية ١٤٪ · لا تُنافس العنوان ولا تُبطئ الرسم (مسار واحد)</text>

  <!-- ٣ · الحالة الفارغة -->
  <text x="1000" y="726" text-anchor="end" font-size="19" font-weight="700" fill="#1E6E5C">٣ · الحالة الفارغة — علامة خطّية فوق النصّ</text>
  <rect x="60" y="748" width="920" height="290" rx="14" fill="#FFFFFF" stroke="#E4E1D8"/>
  <g transform="translate(370,700) scale(0.42)"><use href="#qamLine" stroke="#C9C5B8"/></g>
  <text x="520" y="930" text-anchor="middle" font-size="19" fill="#8A8578">لا عقود بعد · أضِف أول عقد من الزر أعلاه</text>
  <text x="1000" y="1076" text-anchor="end" font-size="15" fill="#6B7280">تحلّ محلّ الفراغ الحالي · وهي المكوّن نفسه بلون باهت وحجم أصغر</text>

  <text x="1000" y="1140" text-anchor="end" font-size="16" fill="#10192E">مكوّن واحد «Qamariya» بثلاث حالات: مضاءة · باهتة · خطّية — فلا يتكرر رسمها في كل شاشة</text>
</svg>

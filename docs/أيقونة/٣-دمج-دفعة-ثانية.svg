<text x="640" y="402" text-anchor="end" font-size="17" font-weight="700" fill="#10192E">ح · البيت وانعكاسه الملوَّن</text>
<text x="640" y="428" text-anchor="end" font-size="13" fill="#6B7280">الخطّ فوق الأرض، وزجاج القمرية انعكاسه تحتها</text>

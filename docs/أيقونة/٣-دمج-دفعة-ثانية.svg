<text x="640" y="262" text-anchor="end" font-size="17" font-weight="700" fill="#10192E">ز · إيوان بأقواس متداخلة</text>
<text x="640" y="288" text-anchor="end" font-size="13" fill="#6B7280">ثلاثة أقواس تتلقّى بعضها، وأصغرها زجاج مضاء</text>
<g transform="translate(56,360) scale(1.08)"><g clip-path="url(#sq)"><use href="#o3"/></g></g>

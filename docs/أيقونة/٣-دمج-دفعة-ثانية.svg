<g transform="translate(184,532) scale(0.44)"><g clip-path="url(#ci)"><use href="#o4"/></g></g>
<text x="640" y="542" text-anchor="end" font-size="17" font-weight="700" fill="#10192E">ط · بيت من فُصوص زجاجية</text>
<text x="640" y="568" text-anchor="end" font-size="13" fill="#6B7280">السقف والجدران فُصوص ملوّنة يفصلها الجصّ</text>

<text x="640" y="122" text-anchor="end" font-size="17" font-weight="700" fill="#10192E">و · البيت المقوَّس</text>
<text x="640" y="148" text-anchor="end" font-size="13" fill="#6B7280">هيكل البيت نفسه صار قوس قمرية مدبَّباً</text>
